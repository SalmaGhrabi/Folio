<div class="rating">
  @for (i of [].constructor(fullStars); track $index) {
    <i class="fas fa-star star-full"></i>
  }
  @if (hasHalfStar) {
    <i class="fas fa-star-half-alt star-half"></i>
  }
  @for (i of [].constructor(emptyStars); track $index) {
    <i class="far fa-star star-empty"></i>
  }
</div>
