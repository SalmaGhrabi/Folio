<nav class="navbar navbar-expand-lg border-bottom shadow-sm py-2 px-3 sticky-top custom-navbar">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/books">
      <span class="brand-icon">F</span>
      <span class="brand-text">FOLIO</span>
    </a>

    <button
      class="navbar-toggler border-0 shadow-none p-2"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isCollapsed()"
      aria-controls="mainNavbarNav"
      aria-label="Toggle navigation menu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isCollapsed()" id="mainNavbarNav">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1 my-2 my-lg-0">
        @for (item of navItems; track item.route) {
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded-2"
              [routerLink]="item.route"
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: !!item.exact }"
              (click)="isCollapsed.set(true)"
            >
              <i class="fas {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>

      <div class="d-flex flex-column flex-lg-row gap-3 align-items-lg-center pt-2 pt-lg-0 border-top border-top-lg-0">

        <form class="search-box" role="search" (submit)="onSearch($event)">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-transparent border-end-0 text-muted">
              <i class="fas fa-search" aria-hidden="true"></i>
            </span>
            <input
              class="form-control border-start-0 ps-0 shadow-none"
              type="search"
              placeholder="Find a book..."
              aria-label="Search books"
            />
          </div>
        </form>

        <div class="user-profile-widget d-flex align-items-center gap-3 ps-lg-3 border-start-lg">
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-circle">
              {{ username().charAt(0).toUpperCase() }}
            </div>
            <div class="d-flex flex-column lh-1">
              <span class="text-xs text-muted">Welcome</span>
              <span class="fw-semibold text-dark text-capitalize">{{ username() }}</span>
            </div>
          </div>

          <button
            class="btn btn-icon-danger btn-sm rounded-circle ms-auto"
            type="button"
            (click)="logout()"
            aria-label="Logout from application"
            title="Sign out"
          >
            <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
          </button>
        </div>

      </div>

    </div>
  </div>
</nav>
