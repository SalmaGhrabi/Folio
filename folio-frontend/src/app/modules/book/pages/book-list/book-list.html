<div class="book-list-page">
  <div class="book-list-header">
    <h2>Browse Books</h2>
    <p>Discover books shared by the Folio community</p>
  </div>

  <div class="books-grid">
    @for (book of bookResponse()?.content; track book.id) {
      <app-book-card
        [book]="book"
        (borrow)="onBorrow($event)"
        (details)="onShowDetails($event)"
        (addToWaitingList)="onAddToWaitingList($event)"
      />
    } @empty {
      <div class="empty-state">
        <p>No books found. Be the first to share one!</p>
      </div>
    }
  </div>
</div>
